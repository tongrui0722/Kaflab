services:
  kaflab:
    build: .
    image: kaflab:local
    container_name: kaflab
    ports:
      - "${KCL_PORT:-8000}:8000"
    environment:
      KCL_USERNAME: "${KCL_USERNAME:-admin}"
      KCL_PASSWORD: "${KCL_PASSWORD:-admin}"
      KCL_DATA_DIR: /data
      KCL_LAG_INTERVAL_SECONDS: "${KCL_LAG_INTERVAL_SECONDS:-60}"
      KCL_LAG_TIMEOUT_SECONDS: "${KCL_LAG_TIMEOUT_SECONDS:-30}"
      KCL_LOG_LEVEL: "${KCL_LOG_LEVEL:-info}"
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    init: true
